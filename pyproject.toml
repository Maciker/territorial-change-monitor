[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "territorial-change-monitor"
version = "0.1.0"
description = "Reproducible satellite-image change monitoring."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3.0",
  "rasterio>=1.4,<2.0",
  "pystac-client>=0.8,<1.0",
  "planetary-computer>=1.0,<2.0",
  "shapely>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[tool.ruff]
line-length = 100
